# Deploys the backend to a Hugging Face Docker Space on every push to main.
# Inactive until you set (GitHub repo > Settings > Secrets and variables > Actions):
#   secret   HF_TOKEN  = a Hugging Face access token with write access to the Space
#   variable HF_SPACE  = <hf-username>/<space-name>, e.g. gowrishankar/hi-speed-backend
name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: huggingface-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push this commit to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then echo "::error::The HF_TOKEN secret is not set"; exit 1; fi
          rm -rf .git .github
          # Hugging Face reads the Space settings from the README front matter
          { printf -- '---\ntitle: Hi-Speed OrderTrack API\nemoji: 📦\ncolorFrom: blue\ncolorTo: indigo\nsdk: docker\napp_port: 8000\npinned: false\n---\n\n'; cat README.md; } > README.space.md
          mv README.space.md README.md
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed ${GITHUB_SHA::7} to https://huggingface.co/spaces/${HF_SPACE}"
